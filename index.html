<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Gotham City hero — move through the darkness and reveal what the symbol hides." />
    <meta name="theme-color" content="#05070a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="/images/batman-base.jpg" />
    <link rel="preload" as="image" href="/images/batman-reveal.jpg" />
    <title>Gotham City — Become the Shadow</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <style>
        .noscript-hero {
          position: relative;
          width: 100vw;
          height: 100svh;
          background: #05070a url('/images/batman-base.jpg') center / cover no-repeat;
          display: flex;
          align-items: flex-end;
          box-sizing: border-box;
          padding: 6vh 6vw;
        }
        .noscript-hero h1 {
          color: #eef4f6;
          font-family: system-ui, sans-serif;
          text-transform: uppercase;
          font-size: clamp(2rem, 7vw, 4rem);
          margin: 0;
          text-shadow: 0 2px 24px rgba(0, 0, 0, 0.7);
        }
      </style>
      <div class="noscript-hero">
        <h1>Become the Shadow</h1>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
